name: BuildMoe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare ksud and key
        run: |
          chmod +x gradlew
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fL -o app/src/main/jniLibs/arm64-v8a/libksud.so \
            https://github.com/tiann/KernelSU/releases/download/v3.3.1/ksud-aarch64-linux-android
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/moe.jks" -alias moe \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass moe123456 -keypass moe123456 \
            -dname "CN=Moe" -storetype JKS
          {
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/moe.jks"
            echo "KEYSTORE_PASSWORD=moe123456"
            echo "KEY_ALIAS=moe"
            echo "KEY_PASSWORD=moe123456"
          } >> gradle.properties
      - name: Build
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
